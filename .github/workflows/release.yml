name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build .deb package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Epson Projeção Linux ${{ github.ref_name }}"
          files: "*.deb"
          draft: false
          prerelease: false
          generate_release_notes: true
