<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Corpo do projetor -->
  <rect x="6" y="20" width="52" height="26" rx="6" fill="url(#grad)" stroke="#002244" stroke-width="2"/>
  <!-- Lente do projetor -->
  <circle cx="20" cy="33" r="8" fill="#ffffff" stroke="#99ccff" stroke-width="2"/>
  <circle cx="20" cy="33" r="5" fill="#3399ff"/>
  <circle cx="18" cy="31" r="2" fill="#ffffff" opacity="0.8"/>
  <!-- Feixe de luz -->
  <path d="M 28 33 L 56 24 L 56 42 Z" fill="#ffff99" opacity="0.4"/>
  <!-- Grade de ventilação / botões -->
  <line x1="42" y1="26" x2="52" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="31" x2="52" y2="31" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="36" x2="52" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Pés do projetor -->
  <rect x="12" y="46" width="6" height="4" rx="1" fill="#333333"/>
  <rect x="46" y="46" width="6" height="4" rx="1" fill="#333333"/>
</svg>
